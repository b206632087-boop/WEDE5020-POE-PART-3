<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumi's Bakery | Enquiries & Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Tumi's Bakery</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Menu</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="enquiries.html">Enquiries</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    </header>

    <main>
        <h2>Place an Enquiry</h2>
        <p>Need a custom cake or bulk order? Fill in the form below and Tumi will get back to you within 23 hours.</p>

        <section>
            <form id="orderform">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your name" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" placeholder="e.g. 082 123 4567" required>

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="your@email.com">

                <label for="orderType">Order Type:</label>
                <select id="orderType" required>
                    <option value="">Select an option</option>
                    <option value="Birthday Cake">Birthday Cake</option>
                    <option value="Wedding cake">Wedding Cake</option>
                    <option value="Catering">Catering</option>
                    <option value="Bulk Order">Bulk Order</option>
                    <option value="other">Other</option>
                </select>

                <label for="date">Preferred Date:</label>
                <input type="date" id="date">

                <label for="orderDetails">Tell us what you need:</label>
                <textarea id="orderDetails" placeholder="Flavour, size, theme, quantity..." rows="5" required></textarea>

                <button type="submit">Send Enquiry</button>
            </form>
        </section>

        <section>
            <h3>Prefer WhatsApp?</h3>
            <p>Click below to chat to us directly.</p>
            <button onclick="sendWhatsAppOrder()">Chat on WhatsApp</button>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Tumi's Bakery. All rights reserved.</p>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
